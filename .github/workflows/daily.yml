name: Daily Music Commit

on:
  schedule:
    # LUNDI, MERCREDI, VENDREDI : 2 fois par jour (ex: 8h14 et 18h14 heure française)
    # Les jours 1,3,5 = Lun, Mer, Ven. (6h et 16h en UTC)
    - cron: '14 6,16 * * 1,3,5'

    # MARDI, JEUDI : 3 fois par jour (ex: 8h27, 13h27 et 18h27 heure française)
    # Les jours 2,4 = Mar, Jeu. (6h, 11h et 16h en UTC)
    - cron: '27 6,11,16 * * 2,4'

    # SAMEDI, DIMANCHE : 1 fois par jour (ex: 10h42 heure française)
    # Les jours 0,6 = Dim, Sam. (8h en UTC)
    - cron: '42 8 * * 0,6'

  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Autorise le bot à commiter sur ton dépôt

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer la librairie
        run: pip install -r requirements.txt

      - name: Lancer le script
        run: python fetch_music.py

      - name: Valider et pousser le commit
        run: |
          git config --global user.name "AsTheLow"
          git config --global user.email "118971209+AsTheLow@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: mise à jour de la playlist du jour 🎵" && git push)